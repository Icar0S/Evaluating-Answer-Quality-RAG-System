<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Test Specialist — Chat</title>
  <link rel="stylesheet" href="styles/shared.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/monitor.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="icon-rail">
      <a href="index.html" class="rail-logo" title="Voltar para a home">RT</a>

      <div class="rail-nav">
        <button class="rail-btn active" data-sidebar="sessions" title="Histórico de conversas">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-8Z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="rail-btn" data-sidebar="monitor" title="Monitor do LLM">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 13.5h3l2.5-7 4 15 2.5-9.5L17 13.5h4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="rail-bottom">
        <span class="badge-dot" id="rail-status-dot" title="Status da API"></span>
      </div>
    </nav>

    <aside class="sidebar" id="sidebar-panel">
      <!-- Painel: histórico de conversas -->
      <div class="sidebar-panel-content" id="sidebar-sessions">
        <div class="sidebar-header">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/>
          </svg>
          <input type="search" id="session-search" placeholder="Buscar conversas..." />
        </div>

        <div class="sidebar-tabs">
          <button class="tab active" data-filter="all">Recentes</button>
          <button class="tab" data-filter="starred">Favoritas</button>
        </div>

        <button class="new-session-btn" id="new-session-btn">
          <span>+</span> Nova conversa
        </button>

        <div class="session-list" id="session-list"></div>
      </div>

      <!-- Painel: monitor do LLM (compacto, cabe na largura da sidebar) -->
      <div class="sidebar-panel-content sidebar-monitor" id="sidebar-monitor" hidden>
        <div class="sidebar-monitor-header">
          <h2>Monitor do LLM</h2>
          <div class="monitor-status-pill" id="monitor-status-pill">
            <span class="badge-dot" id="monitor-status-dot"></span>
            <span id="monitor-status-text">conectando...</span>
          </div>
          <div class="header-tabs" id="provider-tabs"></div>
        </div>

        <div class="monitor-compact-list" id="monitor-grid">
          <div class="monitor-card">
            <div class="monitor-card-label">Modelo carregado</div>
            <div class="monitor-card-value" id="metric-model">—</div>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">CPU</div>
            <div class="monitor-card-value" id="metric-cpu">—</div>
            <canvas class="sparkline" id="sparkline-cpu" width="230" height="36"></canvas>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">RAM</div>
            <div class="monitor-card-value" id="metric-ram">—</div>
            <div class="monitor-bar"><div class="monitor-bar-fill" id="metric-ram-bar"></div></div>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">GPU</div>
            <div class="monitor-card-value" id="metric-gpu">—</div>
            <canvas class="sparkline" id="sparkline-gpu" width="230" height="36"></canvas>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">VRAM</div>
            <div class="monitor-card-value" id="metric-vram">—</div>
            <div class="monitor-bar"><div class="monitor-bar-fill" id="metric-vram-bar"></div></div>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">Velocidade de geração</div>
            <div class="monitor-card-value" id="metric-tps">—</div>
          </div>

          <div class="monitor-card">
            <div class="monitor-card-label">Latência da última resposta</div>
            <div class="monitor-latency-col">
              <div><span class="latency-label">Total</span><span class="latency-value" id="metric-latency-total">—</span></div>
              <div><span class="latency-label">Prompt eval</span><span class="latency-value" id="metric-latency-prompt">—</span></div>
              <div><span class="latency-label">Geração</span><span class="latency-value" id="metric-latency-gen">—</span></div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="panel-header">
        <div class="panel-header-title">
          <h1 id="session-title">Nova conversa</h1>
          <p class="panel-subtitle">Assistente especialista em teste de sistemas LLM/RAG</p>
        </div>
        <div class="header-tabs" id="msg-filter-tabs">
          <button class="header-tab active" data-msg-filter="all">Todas</button>
          <button class="header-tab" data-msg-filter="grounded">Fundamentadas</button>
          <button class="header-tab" data-msg-filter="ungrounded">Sem contexto</button>
        </div>
      </header>

      <div class="chat-log" id="chat-log" data-msg-filter="all"></div>

      <div class="error-banner" id="error-banner" hidden></div>

      <div class="chat-input-wrap">
        <form class="chat-input-bar" id="chat-form">
          <button type="button" class="icon-btn" title="Anexar arquivos (em breve)" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 11.5 12.4 20a4.5 4.5 0 0 1-6.4-6.4l8-8a3 3 0 0 1 4.2 4.2l-7.9 7.9a1.5 1.5 0 0 1-2.1-2.1l7.1-7.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <textarea
            id="question-input"
            placeholder="Pergunte algo sobre teste de sistemas LLM/RAG..."
            rows="1"
            maxlength="4000"
            required
          ></textarea>

          <button type="submit" class="send-btn" id="send-button" title="Enviar" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12 20 4l-6.5 16-2.7-7.3L4 12Z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>

        <div class="chat-input-hint">
          <span class="hint-model" id="hint-model">—</span>
          <span class="hint-keys">
            <span id="hint-char-count" class="hint-char-count" hidden></span>
            <kbd>Enter</kbd> enviar · <kbd>Shift</kbd>+<kbd>Enter</kbd> nova linha
          </span>
        </div>
      </div>
    </main>
  </div>

  <script src="components/chat.js"></script>
  <script src="components/monitor.js"></script>
</body>
</html>
