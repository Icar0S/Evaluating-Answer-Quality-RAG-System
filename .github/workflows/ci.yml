name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nenhum job depende de Ollama, GPU ou do servidor Mac mini: os testes que
# precisam de geracao real (frontend/tests/e2e/chat-flow.spec.ts e afins) se
# auto-pulam quando a API nao esta no ar, e os demais mockam o backend.
jobs:
  api:
    name: Testes de API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Rodar pytest
        run: pytest

  # Camada JevEval (tests/jeveval/): so os testes hermeticos, com o Jev falso de
  # _fake_jev.py. Validam as perguntas, os pesos, a agregacao, o N/A e o formato
  # do export, sem rede e sem chave da TypeSafe. Os testes que chamam o Jev de
  # verdade sao marcados `live` e ficam de fora pelo -m.
  jeveval:
    name: JevEval hermetico (pytest, Jev falso)
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/jeveval/requirements.txt

      - name: Instalar dependencias
        run: pip install -r tests/jeveval/requirements.txt

      - name: Rodar pytest (sem rede, sem chave)
        run: pytest tests/jeveval -m "not live" -p no:cacheprovider

  # frontend/index.html e frontend/home-assets/ sao gerados por frontend/home/ e
  # versionados de proposito (o projeto roda sem etapa de build). O risco disso e
  # o artefato sair de sincronia com a fonte sem ninguem perceber; este job
  # rebuilda e falha se o resultado for diferente do que esta commitado.
  homepage-build:
    name: Build da homepage esta atualizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/home/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend/home
        run: npm ci

      - name: Rebuildar
        working-directory: frontend/home
        run: npm run build

      - name: Conferir se ha diferenca
        run: |
          if ! git diff --exit-code -- frontend/index.html frontend/home-assets; then
            echo "::error::O build da homepage esta desatualizado. Rode 'npm run build' em frontend/home/ e commite o resultado."
            exit 1
          fi

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json

      # O playwright.config.ts sobe o servidor estatico com `python -m http.server`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: frontend/tests
        run: npm ci

      - name: Instalar o Chromium
        working-directory: frontend/tests
        run: npx playwright install --with-deps chromium

      - name: Rodar Playwright
        working-directory: frontend/tests
        run: npx playwright test

      - name: Publicar o relatorio quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/
          retention-days: 7

  # A stack e o container de testes do docker compose (README, "Inicio rapido
  # com Docker"): os arquivos do compose montam (base, GPU e perfil tests), a
  # imagem de testes builda, e os testes hermeticos passam dentro dela. Sem
  # Ollama e sem GPU: o modo hermeticos nao precisa da stack (--no-deps).
  docker:
    name: Docker (compose e container de testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os arquivos do compose
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose --profile tests config -q

      # A imagem de testes tem a base do Playwright e os 5 venvs: o runner
      # comeca com pouco disco livre, e as ferramentas abaixo nao sao usadas aqui.
      - name: Liberar disco no runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem de testes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tests.Dockerfile
          tags: rag-test-specialist/tests:latest
          load: true
          cache-from: type=gha,scope=tests-image
          cache-to: type=gha,mode=max,scope=tests-image

      - name: Testes hermeticos no container
        run: docker compose --profile tests run --rm --no-deps -T tests hermeticos
