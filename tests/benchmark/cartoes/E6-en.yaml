# Cartão do E6 em inglês (plano-benchmark.md, §8). Formato provisório: a §9 do plano não chegou.
#
# A mesma varredura do E6.yaml com as perguntas em inglês (input_en, escritas à mão). Em português, o
# baseline acha a evidência em 2 das 31 perguntas da seleção: o ímã de idioma (E1) põe a varredura no
# chão, e top_k, MMR e chunk não têm o que mostrar. O plano faz o mesmo no E4 ("o embedding vencedor do E1,
# ou as perguntas em EN, para a escada não medir o ímã de idioma"). Depois do E1, o E6 em português se
# refaz com o vencedor.
id: E6-en
titulo: Parâmetros de recuperação, com as perguntas em inglês (varredura exploratória)
pergunta: Qual combinação de top_k, MMR, limiar e chunk serve a este acervo, sem o ímã de idioma?
hipotese: >
  MMR melhora a cobertura@4 em fato_distribuido; um limiar calibrado melhora a abstenção correta com falso
  bloqueio pequeno; chunk menor melhora a precisão@k e piora a cobertura.
exploratorio: true
goldens: tests/benchmark/goldens/v2.json
split: selecao

fixos:
  generation_model: gemma3:4b
  generation_temperature: 0
  generation_seed: 42
  generation_num_ctx: auto
  generation_num_predict: 1024
  generation_think: false
  top_k: 4
  retrieval_use_mmr: false
  min_similarity_score: 0.0

bracos:
  base: {indice: pdf-v1, lingua: en, camadas: [c1], papel: baseline}
  k2: {indice: pdf-v1, lingua: en, camadas: [c1], set: {top_k: 2}}
  k8: {indice: pdf-v1, lingua: en, camadas: [c1], set: {top_k: 8}}
  mmr-05:
    indice: pdf-v1
    lingua: en
    camadas: [c1]
    set: {retrieval_use_mmr: true, retrieval_mmr_lambda: 0.5}
    metrica_primaria: {camada: c1, metrica: coverage_at_k}
  mmr-07:
    indice: pdf-v1
    lingua: en
    camadas: [c1]
    set: {retrieval_use_mmr: true, retrieval_mmr_lambda: 0.7}
    metrica_primaria: {camada: c1, metrica: coverage_at_k}
  lim-0428:
    indice: pdf-v1
    lingua: en
    camadas: [c1]
    papel: referencia
    set: {min_similarity_score: 0.428}
    metrica_primaria: {camada: c1, metrica: correct_abstention}
  lim-recal:
    indice: pdf-v1
    lingua: en
    camadas: [c1]
    set: {min_similarity_score: recalibrado}
    metrica_primaria: {camada: c1, metrica: correct_abstention}
  cont: {indice: pdf-v1-cont, lingua: en, camadas: [c1]}
  cont-400: {indice: pdf-cont-400, lingua: en, camadas: [c1], set: {top_k: 8}}
  cont-1200: {indice: pdf-cont-1200, lingua: en, camadas: [c1], set: {top_k: 3}}
  cont-o0: {indice: pdf-cont-o0, lingua: en, camadas: [c1]}

pares:
  - [base, k2]
  - [base, k8]
  - [base, mmr-05]
  - [base, mmr-07]
  - [base, lim-0428]
  - [base, lim-recal]
  - [base, cont]
  - [cont, cont-400]
  - [cont, cont-1200]
  - [cont, cont-o0]

metrica_primaria: {camada: c1, metrica: evidence_at_k}
guardas:
  - {nome: falso bloqueio do limiar recalibrado, par: [base, lim-recal], metrica: c1.false_block, tolerancia_perguntas: 1}
  - {nome: falso bloqueio do limiar de referência, par: [base, lim-0428], metrica: c1.false_block, tolerancia_perguntas: 1}
curva: [base, cont, cont-400, cont-1200, cont-o0]
saida: >
  A mesma do E6: a tabela da varredura em selecao, a curva evidência × tokens, a AUC do limiar e o Δ por
  classe de pergunta.
didatica: >
  Sem o ímã de idioma, o que cada parâmetro faz aparece. Com ele, a varredura inteira fica no chão.
