# Catálogo de operadores de mutação para pipelines RAG (§5 do protocolo).
#
# 18 operadores, cada um injetando UM defeito plausível, rastreado a um dos sete
# pontos de falha de RAG (FP1..FP7, Barnett et al.). Seis estão marcados
# `cuttable: true`: é a regra de corte da semana 6 — se o cronograma apertar,
# remove-se esses seis e a campanha roda com 12 operadores bem instrumentados.
#
# Como um operador é aplicado (ver operators/apply.py):
#   kind: config  -> delta sobre app.config.Settings, aplicado em memória.
#   kind: corpus  -> operação de arquivo sobre work/corpus/ E work/index_src/.
#                    Com `scope: index_only`, mexe apenas em work/index_src/, o
#                    que representa "o corpus está certo, o índice é que não".
#
# `target: role:X` resolve contra corpus/manifest.json -> roles.X, preenchido por
# corpus/build_corpus.py. Papéis, não nomes de arquivo, porque trocar o corpus na
# semana 1 não pode obrigar a reescrever o catálogo.

version: "1.0"

layers:
  corpus: Corpus e ingestão
  chunking: Chunking
  index: Índice
  retrieval: Recuperação
  prompt: Prompt e geração

operators:
  # ---------------------------------------------------------------- corpus ---
  - id: C1
    layer: corpus
    name: Remover documento
    defect: Fonte ausente
    failure_point: FP1
    cuttable: false
    rationale: >
      O documento simplesmente não está mais no corpus. Reparo no mundo real:
      reobter o documento. Distingue-se de E2 porque ali o arquivo existe e só o
      índice está atrasado.
    action:
      kind: corpus
      ops:
        - op: remove_document
          target: role:primary

  - id: C2
    layer: corpus
    name: Documento desatualizado
    defect: Versão anterior permanece indexada
    failure_point: FP1
    cuttable: false
    replicates_incident: true
    rationale: >
      Um dos dois operadores ancorados em incidente observado em operação real de
      RAG no setor público (documento normativo atualizado sem que a versão nova
      chegasse ao pipeline). O arquivo presente no corpus é a variante `prev`,
      gerada por reversão programática de valores (corpus/build_corpus.py), então
      o que mudou é conhecido por construção.
    action:
      kind: corpus
      ops:
        - op: use_variant
          target: role:primary
          variant: prev

  - id: C3
    layer: corpus
    name: Truncar documento (-30%)
    defect: Extração perde o final do PDF
    failure_point: FP1
    cuttable: false
    rationale: >
      Falha clássica de extração: o PDF entra no pipeline sem as últimas páginas.
      Mata apenas os casos cuja evidência mora no trecho perdido, o que é
      exatamente o ponto — a suíte cobre o final do documento?
    action:
      kind: corpus
      ops:
        - op: truncate_pages
          target: role:secondary
          keep_fraction: 0.7

  - id: C4
    layer: corpus
    name: Duplicata conflitante
    defect: Dois valores divergentes no corpus
    failure_point: FP4
    cuttable: true
    rationale: >
      Uma cópia do documento primário, com valores alterados, entra no corpus com
      outro nome. O sistema passa a ter duas respostas defensáveis para a mesma
      pergunta e nenhuma regra para escolher.
    action:
      kind: corpus
      ops:
        - op: add_variant_as_document
          target: role:primary
          variant: conflict
          suffix: "__dup"

  # -------------------------------------------------------------- chunking ---
  - id: K1
    layer: chunking
    name: Chunk 1200 -> 400
    defect: Perda de contexto local
    failure_point: FP3
    cuttable: false
    action:
      kind: config
      overrides:
        chunk_size_tokens: 400

  - id: K2
    layer: chunking
    name: Chunk 1200 -> 3000
    defect: Queda de precisão
    failure_point: FP2
    cuttable: false
    action:
      kind: config
      overrides:
        chunk_size_tokens: 3000

  - id: K3
    layer: chunking
    name: Overlap 200 -> 0
    defect: Conceito partido na fronteira
    failure_point: FP3
    cuttable: false
    action:
      kind: config
      overrides:
        chunk_overlap_tokens: 0

  - id: K4
    layer: chunking
    name: Deslocar fronteiras (+600)
    defect: Corte no meio de regra
    failure_point: FP3
    cuttable: true
    rationale: >
      Mantém tamanho e sobreposição e move só onde o corte cai. É o controle que
      separa "o tamanho do chunk importa" de "a posição do corte importa".
    action:
      kind: config
      overrides:
        chunk_boundary_offset_tokens: 600

  # ----------------------------------------------------------------- índice ---
  - id: E1
    layer: index
    name: Trocar modelo de embedding
    defect: Degradação silenciosa de recall
    failure_point: FP2
    cuttable: true
    rationale: >
      Troca para um modelo menor e de dimensionalidade diferente. Note que o
      oráculo O1 continua usando o modelo de embedding fixado em study.yaml — se
      o instrumento de medida mudasse junto com o SUT, o operador seria
      inobservável por construção.
    action:
      kind: config
      overrides:
        embedding_model: "@models.embedding_alternative"

  - id: E2
    layer: index
    name: Índice obsoleto
    defect: Corpus mudou, reindexação não rodou
    failure_point: FP1
    cuttable: false
    replicates_incident: true
    rationale: >
      Os documentos do papel `recent` estão presentes no corpus e ausentes do
      índice: alguém adicionou/atualizou os arquivos e ninguém rodou a
      reindexação. Reparo no mundo real: POST /ingest. É o segundo operador
      ancorado em incidente observado.
    action:
      kind: corpus
      scope: index_only
      ops:
        - op: remove_document
          target: role:recent

  # ------------------------------------------------------------ recuperação ---
  - id: R1
    layer: retrieval
    name: top-k -> 1
    defect: Evidência necessária não recuperada
    failure_point: FP2
    cuttable: false
    action:
      kind: config
      overrides:
        top_k: 1

  - id: R2
    layer: retrieval
    name: top-k -> 3k
    defect: Diluição de contexto
    failure_point: FP3
    cuttable: false
    action:
      kind: config
      overrides_relative:
        top_k:
          multiply: 3

  - id: R3
    layer: retrieval
    name: Desligar MMR / reranker
    defect: Redundância nos chunks
    failure_point: FP2
    cuttable: true
    action:
      kind: config
      overrides:
        retrieval_use_mmr: false

  - id: R4
    layer: retrieval
    name: Remover limiar de relevância
    defect: Chunk irrelevante em vez de fallback
    failure_point: FP1
    cuttable: false
    rationale: >
      Sem piso de similaridade, uma pergunta fora do corpus recebe os chunks menos
      ruins que existirem e o modelo responde apoiado neles em vez de se abster.
      Requer min_similarity_score > 0 no baseline — calibrado por
      tools/calibrate_retrieval_gate.py.
    action:
      kind: config
      overrides:
        min_similarity_score: 0.0

  # ------------------------------------------------------- prompt e geração ---
  - id: P1
    layer: prompt
    name: Remover ancoragem no contexto
    defect: Usa conhecimento paramétrico
    failure_point: FP6
    cuttable: false
    action:
      kind: config
      overrides:
        prompt_require_grounding: false

  - id: P2
    layer: prompt
    name: Remover instrução de abstenção
    defect: Inventa em vez de dizer que não sabe
    failure_point: FP6
    cuttable: false
    action:
      kind: config
      overrides:
        prompt_require_abstention: false

  - id: P3
    layer: prompt
    name: Remover exigência de citar fonte
    defect: Perde rastreabilidade
    failure_point: FP5
    cuttable: true
    action:
      kind: config
      overrides:
        prompt_require_citation: false

  - id: P4
    layer: prompt
    name: Temperatura 0 -> 0,8
    defect: Aumento de variância
    failure_point: null
    cuttable: false
    rationale: >
      Único operador sem ponto de falha associado: não injeta um erro de conteúdo,
      injeta instabilidade. Serve de controle para a regra do conjunto avaliável —
      se o método funciona, P4 aparece como perda de assinatura modal, não como
      morte coerente.
    action:
      kind: config
      overrides:
        generation_temperature: 0.8
