# Manifesto do corpus do estudo (§6.2 do protocolo).
#
# Critérios fixados: licença que permita redistribuição (o corpus viaja no pacote
# de replicação), 5 a 10 documentos, PDF com camada de texto, conteúdo estável e
# versionável.
#
# Enquanto `documents` estiver vazio, build_corpus.py trabalha com --from
# <diretório local>, o que permite exercitar o pipeline inteiro antes de o corpus
# definitivo estar escolhido.
#
# ATENÇÃO — estado atual da licença: a auditoria
# (`python -m tests.mutation.tools.audit_licenses`) encontrou apenas UM documento
# confirmadamente redistribuível no corpus montado a partir de data/source_pdfs.
# O corpus, como está, não pode ser publicado no Zenodo. Ver o README, seção
# "O que ainda depende de você".

documents: []
#  - name: metarag_metamorphic_testing_for_hallucination_de.pdf
#    url: https://ceur-ws.org/...
#    sha256: ...
#    license: CC-BY-4.0
#    redistributable: true

# ---------------------------------------------------------------------------
# Papéis usados pelo catálogo de operadores.
#
# Sem override aqui, build_corpus.py atribui por ordem alfabética — o que serve
# para destravar o pipeline, mas não para rodar o estudo: os papéis decidem quais
# operadores conseguem ser mortos por algum caso.
#
# primary   -> alvo de C1 (remoção), C2 (versão anterior) e C4 (duplicata
#              conflitante). Precisa de valores numéricos citáveis espalhados
#              pelo documento, porque são eles que as variantes perturbam.
#
# secondary -> alvo de C3 (truncar -30%). Precisa de PROSA COM FATOS no terço
#              final. Este é o papel que mais erra na atribuição automática: em
#              artigo de conferência o terço final costuma ser a bibliografia, e
#              caso nenhum cita bibliografia — C3 viraria mutante equivalente.
#              Medido em 15/09/2026, dos 8 documentos deste corpus apenas
#              rag_driven tinha prosa (e não referências) no trecho que C3 apaga.
#
# recent    -> lista; documentos que "acabaram de entrar no corpus" e que E2
#              deixa de fora do índice. Preferir documentos menores: E2 remove
#              todos eles do índice de uma vez, e um documento grande derrubaria
#              casos que nada têm a ver com o defeito injetado.
#
# Ao trocar o corpus, reavalie os três. O README explica como medir.
roles:
  # primary: 275 valores factuais, 40 deles perturbados pelas variantes. Mantido
  # mesmo com rag_driven tendo mais fatos (329): trocar exigiria regerar as
  # variantes e reancorar c01/c02/c15, sem ganho que justifique.
  primary: does_prompt_engineering_really_impact_llm_genera.pdf

  # secondary: escolhido pela cauda, não pelo total. C3 apaga as páginas 7-9 do
  # metarag, e as três são prosa com 65 fatos citáveis. O rag_driven, que ocupava
  # o papel antes, tem só a página 11 aproveitável no trecho apagado — três casos
  # (c03, c11, c28) disputavam uma página, e o que sobrou virou "qual é o número
  # da página mencionada no trecho?".
  secondary: metarag_metamorphic_testing_for_hallucination_de.pdf

  # recent: os dois menores documentos com fato suficiente. E2 tira ambos do
  # índice de uma vez; documento grande derrubaria casos alheios ao defeito.
  recent:
    - evaluator_bias_in_llm_based_program_repair_a_dis.pdf
    - qaquest_a_gamified_plugin_for_manual_testing.pdf
