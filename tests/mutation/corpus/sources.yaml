# ---------------------------------------------------------------------------
# Papéis usados pelo catálogo de operadores.
#
# Sem override aqui, build_corpus.py atribui por ordem alfabética — o que serve
# para destravar o pipeline, mas não para rodar o estudo: os papéis decidem quais
# operadores conseguem ser mortos por algum caso.
#
# primary   -> alvo de C1 (remoção), C2 (versão anterior) e C4 (duplicata
#              conflitante). Precisa de valores numéricos citáveis espalhados
#              pelo documento, porque são eles que as variantes perturbam.
#
# secondary -> alvo de C3 (truncar -30%). Precisa de PROSA COM FATOS no terço
#              final. Este é o papel que mais erra na atribuição automática: em
#              artigo de conferência o terço final costuma ser a bibliografia, e
#              caso nenhum cita bibliografia — C3 viraria mutante equivalente.
#              Medido em 15/09/2026, dos 8 documentos deste corpus apenas
#              rag_driven tinha prosa (e não referências) no trecho que C3 apaga.
#
# recent    -> lista; documentos que "acabaram de entrar no corpus" e que E2
#              deixa de fora do índice. Preferir documentos menores: E2 remove
#              todos eles do índice de uma vez, e um documento grande derrubaria
#              casos que nada têm a ver com o defeito injetado.
#
# Ao trocar o corpus, reavalie os três. O README explica como medir.
roles:
  primary: does_prompt_engineering_really_impact_llm_genera.pdf
  secondary: rag_driven_multiple_assertions_generation_with_l.pdf
  recent:
    - metarag_metamorphic_testing_for_hallucination_de.pdf
    - evaluator_bias_in_llm_based_program_repair_a_dis.pdf
