# Assertivas determinísticas por caso — o oráculo O2 (§6.4).
#
# ESCOPO DELIBERADO: assertivas olham SÓ A RESPOSTA, nunca os chunks recuperados.
# Uma suíte que já assertasse sobre recuperação responderia a RQ1 por construção
# ("a suíte típica testa a saída e não a recuperação" é a premissa da H1). Se o
# artigo quiser mostrar o contraste, a suíte instrumentada com assertivas de
# recuperação é trabalho futuro, não o baseline medido aqui.
#
# Tipos disponíveis (implementados em oracles/o2_assertions.py):
#   contains_all      values: [...]        todos os termos aparecem
#   contains_any      values: [...]        ao menos um termo aparece
#   not_contains      values: [...]        nenhum termo aparece
#   regex             pattern: "..."       casa com a resposta
#   not_regex         pattern: "..."       não casa
#   must_abstain                           usa a frase de abstenção do SUT
#   must_not_abstain                       não usa a frase de abstenção
#   must_refuse                            abstém-se OU recusa explicitamente
#   must_ask_clarification                 devolve pergunta de esclarecimento
#   must_cite_document                     cita o nome/título do documento fonte
#   must_cite_page                         cita página no formato [.., pág. N]
#   numeric_equals    value: N, tolerance: 0.0   algum número da resposta bate
#   max_words         value: N
#
# Comparação de texto é insensível a caixa e a acentos por padrão
# (ignore_case/ignore_accents), porque a variação de acentuação do modelo local
# não é o defeito que o estudo quer medir.

defaults: {ignore_case: true, ignore_accents: true}
